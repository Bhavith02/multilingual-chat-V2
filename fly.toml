# fly.toml — Fly.io deployment config
app = 'multilingual-chat-v2'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  # Keep 1 machine always running — no cold starts, no sleep (critical for Socket.io)
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  # Free tier: shared CPU, 256MB RAM — fits well within Fly.io free allowance
  cpu_kind = 'shared'
  cpus = 1
  memory = '256mb'
